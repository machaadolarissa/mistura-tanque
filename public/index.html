<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistura no Tanque</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand-mark" href="/">
          Mistura no Tanque
          <span>Compatibilidade de calda</span>
        </a>
        <nav aria-label="Menu">
          <a class="ativa" href="/">Verificar</a>
          <a href="/agua">pH da água</a>
          <a href="/historico">Histórico</a>
        </nav>
      </header>

      <section class="hero">
        <h1>Mistura no Tanque</h1>
        <p>Descubra em segundos se os produtos podem ir juntos no pulverizador.</p>
      </section>

      <section class="painel" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Escolha os produtos</h2>
        <p class="meta">Selecione 2 ou 3 categorias da demo.</p>

        <form id="form-mistura" style="margin-top: 1.1rem">
          <div class="grid-campos">
            <div>
              <label for="produtoA">Produto A</label>
              <select id="produtoA" required></select>
            </div>
            <div>
              <label for="produtoB">Produto B</label>
              <select id="produtoB" required></select>
            </div>
            <div class="campo-full">
              <label for="produtoC">Produto C (opcional)</label>
              <select id="produtoC">
                <option value="">— nenhum —</option>
              </select>
            </div>
            <div class="campo-full">
              <label class="check">
                <input type="checkbox" id="usarPh" checked />
                Considerar pH da água na análise
              </label>
            </div>
          </div>

          <div class="acoes-form">
            <button type="submit">Verificar mistura</button>
          </div>
        </form>

        <div
          id="resultado"
          class="resultado"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </div>

    <script>
      const selA = document.getElementById("produtoA");
      const selB = document.getElementById("produtoB");
      const selC = document.getElementById("produtoC");
      const resultado = document.getElementById("resultado");

      async function carregarProdutos() {
        const r = await fetch("/api/produtos");
        const { produtos } = await r.json();
        const opts = produtos
          .map((p) => `<option value="${p.id}">${p.nome}</option>`)
          .join("");
        selA.innerHTML = opts;
        selB.innerHTML = opts;
        selC.innerHTML = '<option value="">— nenhum —</option>' + opts;
        if (produtos[1]) selB.value = produtos[1].id;
      }

      document.getElementById("form-mistura").addEventListener("submit", async (e) => {
        e.preventDefault();
        resultado.className = "resultado visivel";
        resultado.innerHTML = "Verificando...";

        const corpo = {
          produtoA: selA.value,
          produtoB: selB.value,
          produtoC: selC.value || undefined,
          usarPhAtual: document.getElementById("usarPh").checked,
        };

        const r = await fetch("/api/mistura", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(corpo),
        });
        const json = await r.json();

        if (!r.ok) {
          resultado.className = "resultado nao visivel";
          resultado.innerHTML = `<h3>Erro</h3><p>${json.erro || "Falha"}</p>`;
          return;
        }

        resultado.className = `resultado ${json.nivel} visivel`;

        const paresHtml = json.pares
          .map(
            (p) => `
          <li>
            <span class="badge ${p.nivel}">${p.nivel}</span>
            <strong>${p.a}</strong> + <strong>${p.b}</strong><br />
            ${p.motivo}
          </li>`
          )
          .join("");

        const phHtml =
          json.phUsado === null
            ? ""
            : `<p class='meta'>pH médio da água: <strong>${json.phUsado.toFixed(2)}</strong></p>`;

        const avisosPh =
          json.avisosPh && json.avisosPh.length
            ? `<ul>${json.avisosPh.map((a) => `<li>${a}</li>`).join("")}</ul>`
            : "";

        resultado.innerHTML = `
          <h3>${json.titulo}</h3>
          ${phHtml}
          ${avisosPh}
          <ul class="pares">${paresHtml}</ul>
        `;
      });

      carregarProdutos();
    </script>
  </body>
</html>
